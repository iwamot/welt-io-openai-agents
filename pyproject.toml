[project]
name = "welt-io-openai-agents"
dynamic = ["version"]
description = "The OpenAI Agents SDK (Python) adapter for Welt's wire contract"
readme = "README.md"
# Floor is the oldest Python AgentCore Runtime runs an agent on; nothing below
# the runtime is supported.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Takashi Iwamoto" }]
keywords = ["welt", "slack", "agentcore", "bedrock", "openai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # Imported directly: the reply stream is read as the SDK's own stream
    # event and run item types. 0.21.0 is the oldest version the test suite
    # passes against — it is where `agents.testing` arrived, which the round
    # trip drives the runner over.
    "openai-agents>=0.21.0",
    # Imported directly: the delta events the stream wraps are OpenAI's own
    # types. No floor of its own — the Agents SDK decides which version
    # arrives, and it asks for a newer one than anything here needs.
    "openai",
]

[project.urls]
Repository = "https://github.com/iwamot/welt-io-openai-agents"
Issues = "https://github.com/iwamot/welt-io-openai-agents/issues"

# The dev group is included by `uv sync` and `uv run` by default, and —
# unlike a dev extra — is not published in the wheel metadata.
[dependency-groups]
dev = [
    # examples/agent is a standalone deployable; its dependencies are
    # installed here so lint and type checks cover it against the local
    # library.
    "bedrock-agentcore==1.22.0",
    # Pinned even though it arrives through bedrock-agentcore: the example
    # reads the AWS region off it, and a range gives Renovate nothing to
    # bump, which would leave CI on whatever version comes along.
    "boto3==1.43.83",
    "openai-agents==0.22.0",
    # Pinned even though it arrives through openai-agents, for the same
    # reason as boto3: the package declares a range for it, and CI should
    # name the version it uses.
    "openai==3.5.0",
    # compatibility.sh reads the declared floors with it. Pinned even though it
    # arrives through pytest, so CI names the version it uses.
    "packaging==26.3",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/welt_io_openai_agents/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/welt_io_openai_agents"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codecov.yml",
    "/.github",
    "/compatibility.sh",
    "/examples",
    "/mise.toml",
    "/uv.lock",
    "/validate.sh",
]

[tool.uv]
exclude-newer = "1 day"

[tool.uv.audit]
# Check the locked packages against OSV malware advisories before any sync
# installs them, so a compromised release cannot run its install hooks here.
malware-check = true

[tool.ruff]
include = ["*.py", "examples/**/*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Reference: https://pydevtools.com/handbook/how-to/how-to-configure-recommended-ruff-defaults/
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    # "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "UP",   # Warn if certain things can changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    # "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    # "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    # "NPY",  # Some numpy-specific things
    # Not in the reference URL
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # Allow assert in tests (pytest standard practice)
]

[tool.ty.src]
include = ["examples", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["welt_io_openai_agents"]
branch = true

[tool.coverage.report]
show_missing = true
